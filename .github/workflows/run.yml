name: Verificar Status Stripchat

on:
  schedule:
    # Roda automaticamente a cada 5 minutos
    - cron: '3/5 * * * *'
  workflow_dispatch: # Permite que você clique em um botão para testar manualmente

jobs:
  check-status:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python no servidor
      uses: actions/setup-python@v5
      with:
        python-node: '3.10'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Executar o script de checagem
      env:
        # Aqui o GitHub pega os segredos da caixa-forte e entrega para o código Python
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py

    - name: Salvar o estado atual para evitar spam
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Atualizado o status do streamer [skip ci]"
        file_pattern: 'last_status.txt'
